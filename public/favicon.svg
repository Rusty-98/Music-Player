<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#18122B"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Subtle Audio EQ Waves behind M -->
  <rect x="96" y="270" width="14" height="60" rx="7" fill="url(#glowGrad)" opacity="0.3"/>
  <rect x="126" y="240" width="14" height="90" rx="7" fill="url(#glowGrad)" opacity="0.4"/>
  <rect x="372" y="240" width="14" height="90" rx="7" fill="url(#glowGrad)" opacity="0.4"/>
  <rect x="402" y="270" width="14" height="60" rx="7" fill="url(#glowGrad)" opacity="0.3"/>

  <!-- Glowing Letter M Shape -->
  <path d="M 120 380 L 120 150 C 120 138 132 130 144 136 L 256 260 L 368 136 C 380 130 392 138 392 150 L 392 380 C 392 391 383 400 372 400 L 350 400 C 339 400 330 391 330 380 L 330 220 L 268 288 C 262 295 250 295 244 288 L 182 220 L 182 380 C 182 391 173 400 162 400 L 140 400 C 129 400 120 391 120 380 Z" 
        fill="url(#mGrad)" 
        filter="url(#neonGlow)"/>

  <!-- Center Soundwave Accent Dot -->
  <circle cx="256" cy="355" r="14" fill="#38bdf8" filter="url(#neonGlow)"/>
</svg>
